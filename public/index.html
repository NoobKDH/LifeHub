<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="LifeHub - 생산성 향상을 위한 올인원 대시보드" />
    <title>LifeHub</title>
    <script>
      // 브라우저 스토리지 폴리필
      if (!window.storage) {
        window.storage = {
          get: (key) => {
            const value = localStorage.getItem(key);
            return value ? { value } : null;
          },
          set: (key, value) => {
            localStorage.setItem(key, value);
          }
        };
      }
    </script>
  </head>
  <body>
    <noscript>JavaScript를 활성화해주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
